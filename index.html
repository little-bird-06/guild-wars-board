                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="font-bold text-amber-300 bg-amber-950/40 border border-amber-600/30 px-2 py-1 rounded">S${b.slot}</span>
                            <span class="font-bold text-orange-400 text-sm">${escapeHtml(b.defender)}</span>
                            <span class="text-slate-400 italic">No attack recorded on this date — select a previous battle in the log below.</span>
                        </div>
                    </div>
                    <span class="font-mono font-bold text-slate-400 text-sm">+${b.points}</span>
                </div>
            ` : `
                <!-- 1. BLOC HAUT : Le combat de référence du slot -->
                <div class="flex items-center justify-between bg-slate-950 p-4 rounded-xl border border-slate-800 gap-4 overflow-x-auto text-xs">
                    <div class="flex flex-col items-center justify-center min-w-[70px] border-r border-slate-800 pr-4">
                        <span class="font-mono font-bold text-slate-200 text-sm">${datePart}</span>
                        <span class="font-mono text-slate-400 text-xs">${timePart}</span>
                    </div>

                    <div class="flex flex-col space-y-1 flex-1">
                        <div class="flex items-center gap-2 text-[11px] px-1">
                            <span class="font-bold text-cyan-400 truncate max-w-[180px]">${escapeHtml(b.attacker)}</span>
                            <span class="font-mono text-cyan-300 font-bold bg-cyan-950/60 border border-cyan-800/50 px-2 py-0.5 rounded shadow-sm">${b.attPower || '0'}</span>
                        </div>
                        ${renderTeamGrid(b.rawAttTeam, true, isTitan, b.attTotem, b.attTotemSkills, b.attIndPets)}
                    </div>

                    <span class="text-slate-600 font-bold text-sm px-2">VS</span>

                    <div class="flex flex-col space-y-1 flex-1">
                        <div class="flex items-center gap-2 text-[11px] px-1">
                            <span class="font-bold text-orange-400 truncate max-w-[180px]">${escapeHtml(b.defender)}</span>
                            <span class="font-mono text-purple-300 font-bold bg-purple-950/60 border border-purple-800/50 px-2 py-0.5 rounded shadow-sm">${b.defPower || '0'}</span>
                        </div>
                        ${renderTeamGrid(b.rawDefTeam, false, isTitan, b.defTotem, b.defTotemSkills, b.defIndPets)}
                    </div>

                    <div class="flex items-center justify-center min-w-[70px] border-l border-slate-800 pl-4">
                        <span class="font-mono font-black text-xl ${pointsColorClass}">+${b.points}</span>
                    </div>
                </div>
            `;

            // Structure en 3 blocs verticaux distincts et en pleine largeur
            contentEl.innerHTML = `
                ${topBlockHTML}

				<!-- 2. BLOC CENTRE : Le sélecteur d'historique ajusté au contenu -->
                <div class="flex items-center gap-3 w-full">
                    <span class="text-xs font-bold text-slate-300 uppercase tracking-wider whitespace-nowrap mt-2">Battles log</span>
                    ${renderHistorySelect(defenderAttacksHistory)}
                </div>

                <!-- 3. BLOC BAS : Le conteneur de comparaison en pleine largeur -->
                <div id="comparisonContainer" class="w-full"></div>
            `;

            if (b.isUnattackedSlot && defenderAttacksHistory.length > 0) {
                const selectEl = contentEl.querySelector('select[onchange^="onSelectHistoryBattle"]');
                if (selectEl) selectEl.value = "0";
                onSelectHistoryBattle("0");
            }
        }

		function onSelectHistoryBattle(indexStr) {
            let idx = parseInt(indexStr, 10);
            const container = document.getElementById('comparisonContainer');
            if (!container || isNaN(idx) || !window._currentBattleModalContext) return;

            const ctx = window._currentBattleModalContext;
            const historyList = getDefenderAttacksHistory(ctx.defId, ctx.isTitan, ctx.viewMode);
            
            const convertCSVDateFormat = (str) => {
                if (!str) return 0;
                let matches = str.match(/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
                if (!matches) return 0;
                let [, day, month, hour, min] = matches;
                return parseInt(`2026${month}${day}${hour}${min}`, 10);
            };

            const sortedHistory = [...historyList].sort((a, b) => {
                return convertCSVDateFormat(b.dateTimeFull || b['date time']) - convertCSVDateFormat(a.dateTimeFull || a['date time']);
            });

            const selectedItem = sortedHistory[idx];
            if (!selectedItem || !selectedItem.rawRow) {
                container.innerHTML = '';
                return;
            }

            const selectedRow = selectedItem.rawRow;
            const dateTime = selectedRow['date time'] || '';
            const pts = parseInt(selectedRow['points'] || 0);

            let datePart = '--/--';
            let timePart = '--:--';
            if (dateTime) {
                let matchDate = dateTime.match(/(\d{2})[-/](\d{2})/);
                if (matchDate) datePart = `${matchDate[1]}/${matchDate[2]}`;
                let matchTime = dateTime.match(/(\d{2}:\d{2})/);
                if (matchTime) timePart = matchTime[1];
            }

            const isTitan = ctx.isTitan;
            const pointsColorClass = 'text-white';

            const attPower = formatPower(selectedRow['att power'] || selectedRow['attacker power'] || selectedRow['power'] || 0);
            const defPower = formatPower(selectedRow['def power'] || selectedRow['defender power'] || selectedRow['target power'] || 0);
            const rawAttTeam = selectedRow['att team'] || selectedRow['attacker team'] || '';
            const rawDefTeam = selectedRow['team'] || selectedRow['defender team'] || selectedRow['target team'] || '';
            const attIndPets = selectedRow['attacker pet'] || selectedRow['att pet'] || selectedRow['attacker pets'] || '';
            const defIndPets = selectedRow['defender pet'] || selectedRow['def pet'] || selectedRow['defender pets'] || '';
            const attTotem = selectedRow['A flag/totem'] || selectedRow['att totem'] || '';
            const attTotemSkills = selectedRow['A flag desc/Totem skills'] || selectedRow['att totem skills'] || '';
            const defTotem = selectedRow['D flag/totem'] || selectedRow['def totem'] || '';
            const defTotemSkills = selectedRow['D flag desc/Totem skills'] || selectedRow['def totem skills'] || '';
            const attackerName = selectedRow['att name'] || selectedRow['attacker name'] || selectedRow['attacker id'] || 'Unknown';
            const defenderName = selectedRow['def name'] || selectedRow['defender id'] || 'Unknown';

            // Utilisation du même design en pleine largeur que la boîte principale, avec une bordure ambrée distinctive
            container.innerHTML = `
                <div class="bg-slate-950/90 border border-amber-500/40 p-4 rounded-xl space-y-3 shadow-xl">
                    <div class="flex items-center justify-between gap-4 overflow-x-auto text-xs">
                        <div class="flex flex-col items-center justify-center min-w-[70px] border-r border-slate-800 pr-4">
                            <span class="font-mono font-bold text-amber-300 text-sm">${datePart}</span>
                            <span class="font-mono text-slate-400 text-xs">${timePart}</span>
                        </div>

                        <div class="flex flex-col space-y-1 flex-1">
                            <div class="flex items-center gap-2 text-[11px] px-1">
                                <span class="font-bold text-cyan-400 truncate max-w-[180px]">${escapeHtml(attackerName)}</span>
                                <span class="font-mono text-cyan-300 font-bold bg-cyan-950/60 border border-cyan-800/50 px-2 py-0.5 rounded shadow-sm">${attPower}</span>
                            </div>
                            ${renderTeamGrid(rawAttTeam, true, isTitan, attTotem, attTotemSkills, attIndPets)}
                        </div>

                        <span class="text-slate-600 font-bold text-sm px-2">VS</span>

                        <div class="flex flex-col space-y-1 flex-1">
                            <div class="flex items-center gap-2 text-[11px] px-1">
                                <span class="font-bold text-orange-400 truncate max-w-[180px]">${escapeHtml(defenderName)}</span>
                                <span class="font-mono text-purple-300 font-bold bg-purple-950/60 border border-purple-800/50 px-2 py-0.5 rounded shadow-sm">${defPower}</span>
                            </div>
                            ${renderTeamGrid(rawDefTeam, false, isTitan, defTotem, defTotemSkills, defIndPets)}
                        </div>

                        <div class="flex items-center justify-center min-w-[70px] border-l border-slate-800 pl-4">
                            <span class="font-mono font-black text-xl ${pointsColorClass}">+${pts}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeBattleModal() {
            document.getElementById('battleModal').classList.add('hidden');
            window._currentBattleModalContext = null;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getDateFromSeasonDay(seasonDayStr) {
            if (!seasonDayStr) return null;
            const cleanStr = String(seasonDayStr).replace('-', '_');
            const parts = cleanStr.split('_');
            if (parts.length < 2) return null;

            const yearWeek = parts[0];
            const dayOfWeekStr = parts[1];
            if (yearWeek.length < 6) return null;

            const year = parseInt(yearWeek.slice(0, 4), 10);
            const week = parseInt(yearWeek.slice(4), 10);
            const dayOfWeek = parseInt(dayOfWeekStr, 10);

            if (isNaN(year) || isNaN(week) || isNaN(dayOfWeek)) return null;

            const simpleDate = new Date(Date.UTC(year, 0, 4));
            const dayIso = simpleDate.getUTCDay() || 7;
            simpleDate.setUTCDate(simpleDate.getUTCDate() - dayIso + 1);
            simpleDate.setUTCDate(simpleDate.getUTCDate() + (week - 1) * 7 + (dayOfWeek - 1));

            const yyyy = simpleDate.getUTCFullYear();
            const mm = String(simpleDate.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(simpleDate.getUTCDate()).padStart(2, '0');

            return {
                shortDate: `${dd}/${mm}`,
                fullDate: `${dd}/${mm}`,
                iso: `${yyyy}-${mm}-${dd}`
            };
        }

        function extractDateForWar(warKey, warData) {
            if (warData && warData.season_day) {
                const seasonDate = getDateFromSeasonDay(warData.season_day);
                if (seasonDate) return seasonDate;
            }
            const match = warKey.match(/(\d{4})[-_]?(\d{2})[-_]?(\d{2})/);
            if (match) {
                return { shortDate: `${match[3]}/${match[2]}`, fullDate: `${match[3]}/${match[2]}`, iso: `${match[1]}-${match[2]}-${match[3]}` };
            }
            return { shortDate: '--/--', fullDate: '--/--', iso: '' };
        }

        function updateNavigationUI() {
            const keys = getSortedWarKeys();
            const dateTextEl = document.getElementById('warDateText');
            if (!dateTextEl) return;
            if (keys.length === 0) {
                dateTextEl.innerText = "--/--";
                return;
            }
            if (!appState.activeKey || !appState.wars[appState.activeKey]) appState.activeKey = keys[0];
            const activeData = appState.wars[appState.activeKey];
            const warDateObj = extractDateForWar(appState.activeKey, activeData);
            dateTextEl.innerText = warDateObj.fullDate;
        }

        function getSlotDefenderPower(slotInfo) {
            if (!slotInfo || typeof slotInfo !== 'object') return '';

            const directCandidates = [
                slotInfo.power,
                slotInfo.teamPower,
                slotInfo.defPower,
                slotInfo.defensePower,
                slotInfo.totalPower,
                slotInfo.user?.power
            ];

            for (let val of directCandidates) {
                let num = Number(val);
                if (!isNaN(num) && num > 0) {
                    return formatPower(num);
                }
            }

            if (Array.isArray(slotInfo.team)) {
                let sumPower = 0;
                slotInfo.team.forEach(entry => {
                    if (entry && typeof entry === 'object') {
                        Object.values(entry).forEach(unit => {
                            if (unit && typeof unit === 'object') {
                                let p = Number(unit.power || unit.heroPower || unit.titanPower || 0);
                                if (!isNaN(p) && p > 0) sumPower += p;
                            }
                        });
                    }
                });
                if (sumPower > 0) {
                    return formatPower(sumPower);
                }
            }

            return '';
        }

        function formatPower(val) {
            let num = parseInt(val);
            if (isNaN(num) || num === 0) return val;
            return num.toLocaleString('en-US');
        }

        function extractTimeOnly(dateTimeStr) {
            if (!dateTimeStr) return '';
            const match = dateTimeStr.match(/(\d{2}:\d{2})/);
            return match ? match[1] : dateTimeStr;
        }

        function formatLoginDate(tsVal) {
            let num = Number(tsVal);
            if (isNaN(num) || num <= 0) return 'Unknown';
            const date = new Date(num > 1e12 ? num : num * 1000);
            if (isNaN(date.getTime())) return 'Unknown';
            const dd = String(date.getUTCDate()).padStart(2, '0');
            const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
            const yyyy = date.getUTCFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        function renderDashboard() {
            const statusEl = document.getElementById('globalStatus');
            const dash = document.getElementById('dashboard');
            if (!dash) return;

            if (!appState.activeKey || !appState.wars[appState.activeKey]) {
                if (statusEl) statusEl.innerText = `✅ Active DB: 0 war(s) | ${appState.heroes.length + appState.titans.length} tot. battles`;
                dash.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 p-12 rounded-xl text-center text-slate-400 shadow-lg">
                        <div class="text-xl font-medium text-slate-300 mb-2">No active war</div>
                        <p class="text-sm">Click <span class="text-amber-400 font-bold">🔒 Admin</span> to import a war.</p>
                    </div>
                `;
                return;
            }

            if (statusEl) statusEl.innerText = `✅ Active DB: ${Object.keys(appState.wars).length} war(s) | ${appState.heroes.length + appState.titans.length} tot. battles`;

            const data = appState.wars[appState.activeKey];
            const guildCtx = buildActiveWarGuildContext(data);
            const enemyName = getEnemyName(data);
            const ourMembersMap = guildCtx.ourMembersMap;
            const enemyMembersMap = guildCtx.enemyMembersMap;
            const enemySlots = data.data?.enemySlots || {};
            const ourSlots = data.data?.ourSlots || {};
            const ourClanName = getOurClanName(data);
            const maxAttacks = 30;
            const warDateObj = extractDateForWar(appState.activeKey, data);
            let warDateJs = warDateObj.iso ? new Date(warDateObj.iso + 'T00:00:00Z') : new Date();

            const activeChampion = typeof getSavedChampionName === 'function'
                ? getSavedChampionName(getGuildChampionsList(ourMembersMap))
                : '';

            // Planification des attaques parfaites (suggestions par slot)
            const plannedBySlot = new Map();
            if (appState.currentView === 'attacks' && typeof planPerfectAttacks === 'function') {
                const plannedAssignments = planPerfectAttacks(
                    ourMembersMap,
                    enemySlots,
                    appState.heroes,
                    appState.titans,
                    2,
                    CHAMPION_WIN_POINTS_THRESHOLD
                );
                
                plannedAssignments.forEach(item => {
                    const slotNum = Number(item.slot);
                    if (!plannedBySlot.has(slotNum)) {
                        plannedBySlot.set(slotNum, []);
                    }
                    plannedBySlot.get(slotNum).push({
                        name: item.championName,
                        pastPoints: Number(item.pastPoints || 0)
                    });
                });
            }

            const allKeys = getSortedWarKeys();
            const enemyWarKeys = allKeys.filter(k => getEnemyName(appState.wars[k]) === enemyName);
            const enemyWarIndex = enemyWarKeys.indexOf(appState.activeKey);
            const hasMultipleEnemyWars = enemyWarKeys.length > 1;

            let enemyHeroMap = {}, enemyTitanMap = {};
            let enemyUserIds = new Set();
            for (let [sId, sInfo] of Object.entries(enemySlots)) {
                if (sInfo && sInfo.user && sInfo.user.id) {
                    let uId = String(sInfo.user.id);
                    enemyUserIds.add(uId);
                    let slotNum = parseInt(sId);
                    let teamType = (sInfo.team && sInfo.team[0] && sInfo.team[0]['1'] && sInfo.team[0]['1'].type) || 'hero';
                    if (teamType === 'titan') enemyTitanMap[uId] = slotNum;
                    else enemyHeroMap[uId] = slotNum;
                }
            }

            let ourHeroMap = {}, ourTitanMap = {};
            let ourUserIds = new Set();
            for (let [sId, sInfo] of Object.entries(ourSlots)) {
                if (sInfo && sInfo.user && sInfo.user.id) {
                    let uId = String(sInfo.user.id);
                    ourUserIds.add(uId);
                    let slotNum = parseInt(sId);
                    let teamType = (sInfo.team && sInfo.team[0] && sInfo.team[0]['1'] && sInfo.team[0]['1'].type) || 'hero';
                    if (teamType === 'titan') ourTitanMap[uId] = slotNum;
                    else ourHeroMap[uId] = slotNum;
                }
            }

            let slotToFort = {};
            FORTIFICATIONS.forEach(f => { f.slots.forEach(s => slotToFort[s] = f.name); });

            let activeAttackerIds = new Set();

            function extractCsvDateDDMM(dateTimeStr) {
                if (!dateTimeStr) return '';
                const matches = dateTimeStr.match(/(\d{2})[-/](\d{2})/g);
                if (!matches) return false;
                return matches.some(m => m.replace(/-/g, '/') === warDateObj.shortDate);
            }

            function collectAttackersFromRows(rows) {
                if (!rows || !Array.isArray(rows)) return;
                rows.forEach(row => {
                    const dateTime = row['date time'] || '';
                    if (!extractCsvDateDDMM(dateTime)) return;
                    let attId = String(row['attacker id'] || '');
                    if (attId) activeAttackerIds.add(attId);
                });
            }

            collectAttackersFromRows(appState.heroes);
            collectAttackersFromRows(appState.titans);

            function getInactivePlayersFromMembersMap(membersMap, clanTitle) {
                let list = [];
                if (!(membersMap instanceof Map)) return list;

                membersMap.forEach((member, uId) => {
                    if (!activeAttackerIds.has(uId)) {
                        let tsVal = Number(member.lastLoginTime || 0);
                        let loginDateJs = (tsVal > 0) ? new Date(tsVal > 1e12 ? tsVal : tsVal * 1000) : null;
                        
                        let daysInactive = 0;
                        if (loginDateJs && !isNaN(loginDateJs.getTime())) {
                            let diffTime = warDateJs.getTime() - loginDateJs.getTime();
                            daysInactive = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
                        }

                        list.push({
                            name: member.name || 'Unknown',
                            clan: clanTitle,
                            daysInactive: daysInactive,
                            lastLogin: formatLoginDate(tsVal)
                        });
                    }
                });
                list.sort((a, b) => b.daysInactive - a.daysInactive);
                return list;
            }

            const ourInactives = getInactivePlayersFromMembersMap(ourMembersMap, ourClanName);
            const enemyInactives = getInactivePlayersFromMembersMap(enemyMembersMap, enemyName);

            window._activeBattlesMap.clear();
            let battleCounter = 0;

            function calculateModeData(isDefenseMode) {
                let slotPoints = {};
                for (let i = 1; i <= 30; i++) slotPoints[i] = 0;
                let fortAttacks = {};
                FORTIFICATIONS.forEach(f => fortAttacks[f.name] = []);
                let validCount = 0;

                let rawAttacksList = [];

                function collectRows(rows, heroMap, titanMap, typeLabel) {
                    if (!rows || !Array.isArray(rows)) return;
                    rows.forEach(row => {
                        const dateTime = row['date time'] || '';
                        if (!extractCsvDateDDMM(dateTime)) return;

                        let attId = String(row['attacker id'] || '');
                        let defId = String(row['defender id'] || '');
                        let pts = parseInt(row['points'] || 0);

                        if (!isDefenseMode) {
                            let sId = heroMap[defId] !== undefined ? heroMap[defId] : titanMap[defId];
                            if (sId !== undefined && ourUserIds.has(attId) && enemyUserIds.has(defId)) {
                                battleCounter++;
                                let bId = `atk_${battleCounter}`;
                                let bObj = {
                                    id: bId,
                                    attacker: row['att name'] || attId || 'Unknown',
                                    defender: row['def name'] || defId || 'Unknown',
                                    attId: attId,
                                    defId: defId,
                                    attPower: formatPower(row['att power'] || row['attacker power'] || row['power'] || 0),
                                    defPower: formatPower(row['def power'] || row['defender power'] || row['target power'] || 0),
                                    slot: sId, points: isNaN(pts) ? 0 : pts, type: typeLabel,
                                    timeOnly: extractTimeOnly(dateTime),
                                    dateTimeFull: dateTime,
                                    rawAttTeam: row['att team'] || row['attacker team'] || '',
                                    rawDefTeam: row['team'] || row['defender team'] || row['target team'] || '',
                                    attIndPets: row['attacker pet'] || row['att pet'] || row['attacker pets'] || '',
                                    defIndPets: row['defender pet'] || row['def pet'] || row['defender pets'] || '',
                                    attTotem: row['A flag/totem'] || row['att totem'] || '',
                                    attTotemSkills: row['A flag desc/Totem skills'] || row['att totem skills'] || '',
                                    defTotem: row['D flag/totem'] || row['def totem'] || '',
                                    defTotemSkills: row['D flag desc/Totem skills'] || row['def totem skills'] || ''
                                };
                                window._activeBattlesMap.set(bId, bObj);
                                rawAttacksList.push(bObj);
                                validCount++;
                            }
                        } else {
                            let sId = heroMap[defId] !== undefined ? heroMap[defId] : titanMap[defId];
                            if (sId !== undefined && enemyUserIds.has(attId) && ourUserIds.has(defId)) {
                                battleCounter++;
                                let bId = `def_${battleCounter}`;
                                let bObj = {
                                    id: bId,
                                    attacker: row['att name'] || attId || 'Unknown',
                                    defender: row['def name'] || defId || 'Unknown',
                                    attId: attId,
                                    defId: defId,
                                    attPower: formatPower(row['att power'] || row['attacker power'] || row['power'] || 0),
                                    defPower: formatPower(row['def power'] || row['defender power'] || row['target power'] || 0),
                                    slot: sId, points: isNaN(pts) ? 0 : pts, type: typeLabel,
                                    timeOnly: extractTimeOnly(dateTime),
                                    dateTimeFull: dateTime,
                                    rawAttTeam: row['att team'] || row['attacker team'] || '',
                                    rawDefTeam: row['team'] || row['defender team'] || row['target team'] || '',
                                    attIndPets: row['attacker pet'] || row['att pet'] || row['attacker pets'] || '',
                                    defIndPets: row['defender pet'] || row['def pet'] || row['defender pets'] || '',
                                    attTotem: row['A flag/totem'] || row['att totem'] || '',
                                    attTotemSkills: row['A flag desc/Totem skills'] || row['att totem skills'] || '',
                                    defTotem: row['D flag/totem'] || row['def totem'] || '',
                                    defTotemSkills: row['D flag desc/Totem skills'] || row['def totem skills'] || ''
                                };
                                window._activeBattlesMap.set(bId, bObj);
                                rawAttacksList.push(bObj);
                                validCount++;
                            }
                        }
                    });
                }

                const activeHeroMap = isDefenseMode ? ourHeroMap : enemyHeroMap;
                const activeTitanMap = isDefenseMode ? ourTitanMap : enemyTitanMap;
                const activeSlotsTarget = isDefenseMode ? ourSlots : enemySlots;

                collectRows(appState.heroes, activeHeroMap, {}, 'Hero');
                collectRows(appState.titans, {}, activeTitanMap, 'Titan');

                let attacksBySlot = {};
                for (let i = 1; i <= 30; i++) attacksBySlot[i] = [];

                rawAttacksList.forEach(atk => {
                    attacksBySlot[atk.slot].push(atk);
                });

                // Étape 1 : Calcul intermédiaire pour déterminer le score provisoire de chaque slot (notamment le Bridge 7, 8, 9)
                let tempSlotPoints = {};
                for (let sId = 1; sId <= 30; sId++) {
                    let slotInfo = activeSlotsTarget[String(sId)];
                    let teamArr = slotInfo?.team;
                    let isEmptyTeam = !teamArr || teamArr.length === 0 || (Array.isArray(teamArr) && teamArr.length === 1 && Object.keys(teamArr[0]).length === 0);

                    if (isEmptyTeam) {
                        tempSlotPoints[sId] = (sId <= 9) ? 20 : 0;
                    } else {
                        let slotList = attacksBySlot[sId];
                        let currentSlotTotal = 0;
                        slotList.forEach(atk => {
                            let before = currentSlotTotal;
                            let added = atk.points;
                            if (before >= 20) added = 0;
                            else if (before + added > 20) added = 20 - before;
                            currentSlotTotal += added;
                        });
                        tempSlotPoints[sId] = currentSlotTotal;
                    }
                }

                // Vérification si le Bridge (7, 8, 9) est entièrement validé (>= 20 pts chacun)
                let bridgeCaptured = (tempSlotPoints[7] >= 20 && tempSlotPoints[8] >= 20 && tempSlotPoints[9] >= 20);

                // Étape 2 : Attribution définitive des points et construction des objets d'affichage
                for (let sId = 1; sId <= 30; sId++) {
                    let slotInfo = activeSlotsTarget[String(sId)];
                    let teamArr = slotInfo?.team;
                    let isEmptyTeam = !teamArr || teamArr.length === 0 || (Array.isArray(teamArr) && teamArr.length === 1 && Object.keys(teamArr[0]).length === 0);

                    if (isEmptyTeam) {
                        let pointsVal = 0;
                        if (sId <= 9) {
                            pointsVal = 20;
                        } else if (bridgeCaptured) {
                            pointsVal = 20;
                        }

                        slotPoints[sId] = pointsVal;

                        battleCounter++;
                        let bId = `empty_${isDefenseMode ? 'def' : 'atk'}_${battleCounter}`;
                        let fName = slotToFort[sId];
                        let dummyAtk = {
                            id: bId,
                            attacker: "No defense",
                            defender: slotInfo?.user?.name || `Slot ${sId}`,
                            attPower: "",
                            defPower: "",
                            slot: sId,
                            points: pointsVal,
                            type: isTitanSlot(sId) ? "Titan" : "Hero",
                            timeOnly: "",
                            dateTimeFull: "",
                            cumulBefore: 0,
                            cumulAfter: pointsVal,
                            isSuccessful: pointsVal > 0,
                            isEmptySlot: true
                        };
                        window._activeBattlesMap.set(bId, dummyAtk);
                        if (fName) fortAttacks[fName].push(dummyAtk);
                    } else {
                        let slotList = attacksBySlot[sId];
                        if (slotList.length === 0) {
                            battleCounter++;
                            let bId = `unatk_${isDefenseMode ? 'def' : 'atk'}_${battleCounter}`;
                            let fName = slotToFort[sId];
                            let defName = slotInfo?.user?.name || `Slot ${sId}`;
                            let defId = slotInfo?.user?.id ? String(slotInfo.user.id) : '';
                            let slotDefPower = getSlotDefenderPower(slotInfo);
                            let teamType = (slotInfo?.team && slotInfo.team[0] && slotInfo.team[0]['1'] && slotInfo.team[0]['1'].type) || (isTitanSlot(sId) ? 'titan' : 'hero');
                            let unattackedEntry = {
                                id: bId,
                                attacker: "No attacker",
                                defender: defName,
                                defId: defId,
                                attPower: "",
                                defPower: slotDefPower,
                                slot: sId,
                                points: 0,
                                type: teamType === 'titan' ? 'Titan' : 'Hero',
                                timeOnly: "",
                                dateTimeFull: "",
                                cumulBefore: 0,
                                cumulAfter: 0,
                                isSuccessful: false,
                                isEmptySlot: false,
                                isUnattackedSlot: true
                            };
                            window._activeBattlesMap.set(bId, unattackedEntry);
                            if (fName) fortAttacks[fName].push(unattackedEntry);
                            slotPoints[sId] = 0;
                        } else {
                            slotList.sort((a, b) => a.dateTimeFull.localeCompare(b.dateTimeFull));

                            let currentSlotTotal = 0;
                            slotList.forEach(atk => {
                                let before = currentSlotTotal;
                                let added = atk.points;

                                if (before >= 20) {
                                    added = 0;
                                } else if (before + added > 20) {
                                    added = 20 - before;
                                }

                                currentSlotTotal += added;
                                let after = currentSlotTotal;

                                atk.cumulBefore = before;
                                atk.points = added;
                                atk.cumulAfter = after;
                                atk.isSuccessful = (after === 20) || (before >= 20 && added > 0);

                                let fName = slotToFort[sId];
                                if (fName) {
                                    fortAttacks[fName].push(atk);
                                }
                            });
                            slotPoints[sId] = currentSlotTotal;
                        }
                    }
                }

                Object.keys(fortAttacks).forEach(fName => {
                    fortAttacks[fName].sort((a, b) => { 
                        if (a.slot !== b.slot) return a.slot - b.slot; 
                        return a.dateTimeFull.localeCompare(b.dateTimeFull); 
                    });
                });

                let rawPoints = Object.values(slotPoints).reduce((a, b) => a + b, 0);
                let totalBonus = 0;
                let fortResults = FORTIFICATIONS.map(f => {
                    let allWon = f.slots.every(s => slotPoints[s] >= 20);
                    if (allWon) totalBonus += f.bonus;
                    return { ...f, allWon, attacks: fortAttacks[f.name] };
                });

                return {
                    validCount,
                    totalScore: rawPoints + totalBonus,
                    fortResults
                };
            }

            const attackData = calculateModeData(false);
            const defenseData = calculateModeData(true);
            const currentData = appState.currentView === 'attacks' ? attackData : defenseData;

            const ourScore = attackData.totalScore;
            const enemyScore = defenseData.totalScore;
            
            let ourScoreColor = ourScore > enemyScore ? "text-emerald-400 font-black" : (enemyScore > ourScore ? "text-rose-400 font-black" : "text-amber-400 font-black");
            let enemyScoreColor = enemyScore > ourScore ? "text-emerald-400 font-black" : (ourScore > enemyScore ? "text-rose-400 font-black" : "text-amber-400 font-black");

            const championSelectorMarkup = typeof renderChampionSelectorHTML === 'function'
                ? renderChampionSelectorHTML(ourMembersMap, escapeHtml)
                : '';

            function getFortTypeBadgeHTML(fortType) {
                if (fortType === 'Titan') {
                    return `<span class="text-[10px] px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-400 font-semibold">Titan</span>`;
                }
                return `<span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-semibold">Hero</span>`;
            }

            dash.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col justify-between shadow-lg hover:border-amber-500/50 transition cursor-pointer group" onclick="openEnemyModal()" title="Click to choose an opponent">
                        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1 flex justify-between items-center">
                            <span>Opponent (Change 🔍)</span>
                            ${hasMultipleEnemyWars ? `<span class="text-[10px] bg-amber-500/20 text-amber-300 px-1 rounded font-mono">${enemyWarIndex + 1}/${enemyWarKeys.length}</span>` : ''}
                        </div>
                        <div class="flex items-center justify-between gap-1 my-1">
                            <button onclick="event.stopPropagation(); navigateEnemyWar(-1)" ${!hasMultipleEnemyWars || enemyWarIndex === 0 ? 'disabled class="opacity-20 cursor-not-allowed text-xs text-slate-500 p-1"' : 'class="text-xs text-amber-400 hover:text-amber-300 font-bold p-1 cursor-pointer transition"'}>◀</button>
                            <div class="text-base font-bold text-amber-400 group-hover:text-amber-300 truncate px-1 text-center" title="${enemyName}">${enemyName}</div>
                            <button onclick="event.stopPropagation(); navigateEnemyWar(1)" ${!hasMultipleEnemyWars || enemyWarIndex === enemyWarKeys.length - 1 ? 'disabled class="opacity-20 cursor-not-allowed text-xs text-slate-500 p-1"' : 'class="text-xs text-amber-400 hover:text-amber-300 font-bold p-1 cursor-pointer transition"'}>▶</button>
                        </div>
                        <div class="text-[10px] text-slate-500 text-center">${hasMultipleEnemyWars ? 'Multiple clashes' : 'Single clash'}</div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center shadow-lg flex flex-col justify-center">
                        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Our Attacks</div>
                        <div class="text-lg font-bold text-cyan-400">${attackData.validCount} / ${maxAttacks}</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center shadow-lg flex flex-col justify-center">
                        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Our Final Score</div>
                        <div class="text-xl ${ourScoreColor}">${ourScore} pts</div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center shadow-lg flex flex-col justify-center">
                        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Enemy Attacks</div>
                        <div class="text-lg font-bold text-orange-400">${defenseData.validCount} / ${maxAttacks}</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center shadow-lg flex flex-col justify-center">
                        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Enemy Final Score</div>
                        <div class="text-xl ${enemyScoreColor}">${enemyScore} pts</div>
                    </div>
                </div>

                <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-center border-b border-slate-800 pb-4 gap-3">
                        <h2 class="text-base font-bold text-slate-200">
                            Fortifications Details <span class="text-xs font-normal text-slate-400 ml-2">(Click a row to view battle lineup)</span>
                        </h2>
                        <div class="flex flex-wrap items-center gap-3">
                            ${championSelectorMarkup}
                            <div class="inline-flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                                <button onclick="switchView('attacks')" class="px-3 py-1.5 text-xs font-semibold rounded-md transition cursor-pointer ${appState.currentView === 'attacks' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}">
                                    ⚔️ Attacks
                                </button>
                                <button onclick="switchView('defenses')" class="px-3 py-1.5 text-xs font-semibold rounded-md transition cursor-pointer ${appState.currentView === 'defenses' ? 'bg-rose-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}">
                                    🛡️ Defenses
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        ${currentData.fortResults.map(f => `
                            <div class="bg-slate-950 border ${f.allWon ? 'border-emerald-500/50 bg-emerald-950/10' : 'border-slate-800'} p-4 rounded-xl space-y-3">
                                <div class="flex justify-between items-center border-b border-slate-800 pb-2 gap-2 flex-wrap">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="font-bold text-slate-200 text-sm">${f.name}</span>
                                        ${getFortTypeBadgeHTML(f.type)}
                                        <span class="text-xs text-slate-500">(Slots: ${f.slots.join(', ')})</span>
                                    </div>
                                    <span class="text-xs px-2 py-0.5 rounded font-semibold ${f.allWon ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400'}">
                                        ${f.allWon ? `Captured (+${f.bonus} pts)` : `Bonus: +${f.bonus} pts`}
                                    </span>
                                </div>
                                <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                                    ${f.attacks.length === 0 ? `<div class="text-xs text-slate-500 italic py-1">No battle recorded for this date.</div>` : 
                                        f.attacks.map(atk => {
                                            if (atk.isEmptySlot) {
                                                const pointsColorClass = atk.points > 0 ? 'text-emerald-400' : 'text-slate-500';
                                                return `
                                                    <div class="flex justify-between items-center text-xs bg-slate-900/50 px-3 py-2 rounded-lg border border-slate-800/40 opacity-75">
                                                        <div class="flex items-center gap-2">
                                                            <span class="font-bold text-slate-500 bg-slate-950 border border-slate-800 px-1.5 py-0.5 rounded">S${atk.slot}</span>
                                                            <span class="text-slate-400 italic">No defense</span>
                                                        </div>
                                                        <span class="font-mono font-bold ${pointsColorClass}">+${atk.points}</span>
                                                    </div>
                                                `;
                                            }

											const suggestedChampions =
                                                appState.currentView === 'attacks' ? (plannedBySlot.get(Number(atk.slot)) || []) : [];

                                            const suggestionChipsHtml = suggestedChampions.length > 0
                                                ? suggestedChampions.map(sugg => {
                                                    const isConfirmedWin = Number(sugg.pastPoints) === 20;
                                                    const chipClasses = isConfirmedWin
                                                        ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40'
                                                        : 'bg-emerald-500/15 text-white border-slate-300';
                                                    const tooltip = `${sugg.pastPoints} pts`;

                                                    return `
                                                        <span class="text-[8px] font-semibold px-1 py-0 rounded-full border whitespace-nowrap ${chipClasses}" title="${escapeHtml(tooltip)}">
                                                            🎯 ${escapeHtml(sugg.name)}
                                                        </span>
                                                    `;
                                                }).join('')
                                                : '';

                                            const isBeatenByChampion =
                                                appState.currentView === 'attacks' &&
                                                Boolean(activeChampion) &&
                                                typeof hasChampionBeatenDefender === 'function' ?
                                                hasChampionBeatenDefender(
                                                    activeChampion,
                                                    atk.defId,
                                                    atk.defender,
                                                    atk.type,
                                                    appState.heroes,
                                                    appState.titans,
                                                    CHAMPION_WIN_POINTS_THRESHOLD
                                                ) : '';

                                            const championHighlightClass =
                                                typeof getChampionSlotHighlightClass === 'function'
                                                    ? getChampionSlotHighlightClass(isBeatenByChampion)
                                                    : '';

                                            if (atk.isUnattackedSlot) {
                                                return `
                                                <div onclick="openBattleModal('${atk.id}')" class="flex flex-col sm:flex-row justify-between items-start sm:items-center text-[10px] bg-slate-900/70 hover:bg-slate-850 hover:border-amber-500/40 px-3 py-2 rounded-lg border border-slate-800/70 gap-2 cursor-pointer transition group ${championHighlightClass}">
                                                    <div class="flex items-center gap-2 flex-wrap">
                                                        <span class="font-bold text-amber-300 bg-amber-950/40 border border-amber-600/30 px-1.5 py-0.5 rounded">S${atk.slot}</span>

                                                        <span class="text-slate-500 italic font-medium">${escapeHtml(atk.attacker)}</span>

                                                        <span class="text-slate-500 font-bold">vs</span>

                                                        <div class="flex items-baseline gap-1">
                                                            <span class="text-slate-100 font-bold group-hover:underline">${escapeHtml(atk.defender)}</span>
                                                            ${atk.defPower ? `<span class="text-[11px] font-mono text-purple-300 font-bold bg-purple-950/40 px-1 rounded">${atk.defPower}</span>` : ''}
                                                        </div>
                                                    </div>

                                                    <div class="flex items-center gap-2 self-end sm:self-auto flex-wrap">
                                                        ${suggestionChipsHtml}
                                                        <span class="font-mono font-bold text-slate-400 text-sm" title="Slot total: ${atk.cumulAfter}/20 pts">+${atk.points}</span>
                                                    </div>
                                                </div>
                                            `;
                                            }

                                            const attackerColor = appState.currentView === 'attacks' ? 'text-cyan-300' : 'text-orange-300';
                                            const powerBg = appState.currentView === 'attacks' ? 'bg-cyan-950/40 text-cyan-300' : 'bg-orange-950/40 text-orange-300';
                                            const pointsColorClass = atk.isSuccessful ? 'text-emerald-400' : 'text-rose-500 font-black';

                                            return `
                                            <div onclick="openBattleModal('${atk.id}')" class="flex flex-col sm:flex-row justify-between items-start sm:items-center text-[10px] bg-slate-900 hover:bg-slate-850 hover:border-amber-500/40 px-3 py-2 rounded-lg border border-slate-800/80 gap-2 cursor-pointer transition group ${championHighlightClass}">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="font-bold text-amber-300 bg-amber-950/40 border border-amber-600/30 px-1.5 py-0.5 rounded">S${atk.slot}</span>
                                                    
                                                    <div class="flex items-baseline gap-1">
                                                        <span class="${attackerColor} font-semibold group-hover:underline">${atk.attacker}</span>
                                                        ${atk.attPower ? `<span class="text-[11px] font-mono font-bold ${powerBg} px-1 rounded">${atk.attPower}</span>` : ''}
                                                    </div>

                                                    <span class="text-slate-500 font-bold">vs</span>

                                                    <div class="flex items-baseline gap-1">
                                                        <span class="text-slate-100 font-bold">${atk.defender}</span>
                                                        ${atk.defPower ? `<span class="text-[11px] font-mono text-purple-300 font-bold bg-purple-950/40 px-1 rounded">${atk.defPower}</span>` : ''}
                                                    </div>

                                                    ${atk.timeOnly ? `<span class="text-slate-400 text-[8px] ml-auto sm:ml-1 font-mono bg-slate-800 px-1.5 py-0.5 rounded">[${atk.timeOnly}]</span>` : ''}
                                                </div>

                                                <div class="flex items-center gap-2 self-end sm:self-auto flex-wrap">
                                                    ${suggestionChipsHtml}
                                                    <span class="font-mono font-bold ${pointsColorClass} text-sm" title="Slot total: ${atk.cumulAfter}/20 pts">+${atk.points}</span>
                                                </div>
                                            </div>
                                        `;}).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="text-sm font-bold text-cyan-400 flex items-center gap-2">
                                <span>💤</span> Inactive: ${ourClanName}
                            </h3>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-mono">${ourInactives.length} player(s)</span>
                        </div>
                        <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                            ${ourInactives.length === 0 ? `<div class="text-xs text-emerald-400/80 italic py-2 text-center">No inactive players detected (everyone attacked)!</div>` :
                                ourInactives.map(p => `
                                    <div class="flex justify-between items-center text-xs bg-slate-950 px-3 py-2 rounded-lg border border-slate-800/60">
                                        <div class="flex items-center gap-2">
                                            <span class="text-slate-200 font-semibold">${p.name}</span>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <span class="text-[11px] text-slate-400">${p.clan}</span>
                                            <span class="text-[11px] font-mono text-amber-400 font-bold bg-amber-950/30 px-2 py-0.5 rounded">${p.daysInactive} days (${p.lastLogin})</span>
                                        </div>
                                    </div>
                                `).join('')}
                        </div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="text-sm font-bold text-orange-400 flex items-center gap-2">
                                <span>💤</span> Inactive: ${enemyName}
                            </h3>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-mono">${enemyInactives.length} player(s)</span>
                        </div>
                        <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                            ${enemyInactives.length === 0 ? `<div class="text-xs text-emerald-400/80 italic py-2 text-center">No inactive players detected (everyone attacked)!</div>` :
                                enemyInactives.map(p => `
                                    <div class="flex justify-between items-center text-xs bg-slate-950 px-3 py-2 rounded-lg border border-slate-800/60">
                                        <div class="flex items-center gap-2">
                                            <span class="text-slate-200 font-semibold">${p.name}</span>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <span class="text-[11px] text-slate-400">${p.clan}</span>
                                            <span class="text-[11px] font-mono text-amber-400 font-bold bg-amber-950/30 px-2 py-0.5 rounded">${p.daysInactive} days (${p.lastLogin})</span>
                                        </div>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
