// --- UTILITAIRE 1 : Retourne un format de date de GW (YYYYWW) à partir d'une date du CSV (DD/MM HH:MM) ---
function getWeekKeyFromDateString(dateStr) {
    if (!dateStr) return null;
    let cleanStr = String(dateStr).trim();
    
    // Extrait le DD et le MM du format "DD/MM HH:MM" ou "DD/MM"
    let match = cleanStr.match(/^(\d{2})[/-](\d{2})/);
    if (!match) return null;

    let day = parseInt(match[1], 10);
    let month = parseInt(match[2], 10);
    let year = 2026; // Année de référence pour cette migration

    // Calcul de la semaine ISO
    let dateObj = new Date(Date.UTC(year, month - 1, day));
    let onejan = new Date(Date.UTC(year, 0, 1));
    let weekNum = Math.ceil((((dateObj - onejan) / 86400000) + onejan.getUTCDay() + 1) / 7);
    
    return `${year}${String(weekNum).padStart(2, '0')}`;
}

// --- UTILITAIRE 2 : Extraire la semaine (YYYYWW) pour une guerre ---
function getWeekKeyForWar(warKey, warData) {
    // 1. Si la guerre contient un season_day (ex: 202647_2), on l'utilise en priorité
    if (warData && warData.season_day) {
        let parts = String(warData.season_day).replace('-', '_').split('_');
        if (parts[0] && parts[0].length >= 6) {
            return parts[0];
        }
    }
    // 2. Sinon, on essaie d'extraire l'année/mois/jour depuis la clé de la guerre ou son contenu
    let match = warKey.match(/(\d{4})[-_]?(\d{2})[-_]?(\d{2})/);
    if (match) {
        return getWeekKeyFromDateString(`${match[1]}/${match[2]}/${match[3]}`);
    }
    // 3. Dernier recours : date du jour ou valeur par défaut
    return getWeekKeyFromDateString(new Date().toISOString());
}

// --- FONCTION DE RESTORE (D'UN BACKUP) ---
async function importBackupFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('globalStatus');
    if (statusEl) statusEl.innerText = 'Migration in progress...';

    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const parsedGlobalData = JSON.parse(e.target.result);
            let weeksDataMap = {};

            function getOrCreateWeekBucket(wk) {
                if (!weeksDataMap[wk]) {
                    weeksDataMap[wk] = { weekId: wk, wars: {}, heroes: [], titans: [] };
                }
                return weeksDataMap[wk];
            }

            // 1. GUERRES (JSON) -> Uniquement via season_day
            if (parsedGlobalData.wars) {
                for (let [wKey, wData] of Object.entries(parsedGlobalData.wars)) {
                    if (wData && wData.season_day) {
                        let cleanSeasonDay = String(wData.season_day).replace('-', '_').split('_')[0];
                        let wk = cleanSeasonDay.replace(/[^0-9]/g, '');
                        if (wk.length >= 6) {
                            let bucket = getOrCreateWeekBucket(wk);
                            bucket.wars[wKey] = wData;
                        }
                    }
                }
            }

            // 2. HÉROS (CSV) -> Uniquement via la date de ligne (DD/MM)
            if (Array.isArray(parsedGlobalData.heroes)) {
                parsedGlobalData.heroes.forEach(row => {
                    let dateTime = row['date time'] || row['date'] || '';
                    let wk = getWeekKeyFromDateString(dateTime);
                    if (wk) {
                        getOrCreateWeekBucket(wk).heroes.push(row);
                    }
                });
            }

            // 3. TITANS (CSV) -> Uniquement via la date de ligne (DD/MM)
            if (Array.isArray(parsedGlobalData.titans)) {
                parsedGlobalData.titans.forEach(row => {
                    let dateTime = row['date time'] || row['date'] || '';
                    let wk = getWeekKeyFromDateString(dateTime);
                    if (wk) {
                        getOrCreateWeekBucket(wk).titans.push(row);
                    }
                });
            }

            let allWeeks = Object.keys(weeksDataMap);

            // 4. BATCH FIREBASE (Collection "wars" -> Document "my_guild" -> Sous-collection "weeks")
            let batch = db.batch();
            let count = 0;

            for (let wk of allWeeks) {
                let docRef = db.collection("wars").doc(MY_GUILD_ID).collection("weeks").doc(wk);
                batch.set(docRef, weeksDataMap[wk], { merge: true });

                count++;
                if (count >= 400) {
                    await batch.commit();
                    batch = db.batch();
                    count = 0;
                }
            }
            if (count > 0) await batch.commit();
            
            await reloadApplication();

            alert("🎉 Migration successful! Your wars (by season_day) and CSV battles (by DD/MM date) are neatly organized.");
            if (statusEl) statusEl.innerText = '✅ Cloud migration complete';

        } catch (err) {
            console.error("❌ Erreur migration :", err);
            alert("Error: " + err.message);
        }
    };
    reader.readAsText(file);
}

// --- CHARGEMENT DIRECT DANS APPSATE DEPUIS FIRESTORE ---
async function loadFromCloud(maxWeeks) {
    console.log(`📥 Chargement des données depuis le Cloud (Limite: ${maxWeeks === null ? 'Illimitée' : maxWeeks} semaines)...`);
    const statusEl = document.getElementById('globalStatus');
    if (statusEl) statusEl.innerText = 'Loading data from Cloud...';

    try {
        let query = db.collection("wars")
            .doc(MY_GUILD_ID)
            .collection("weeks")
            .orderBy("weekId", "desc");

        // Si maxWeeks est défini et supérieur à 0, on applique la limite. Sinon, on prend tout.
        if (maxWeeks !== null && maxWeeks !== undefined && maxWeeks > 0) {
            query = query.limit(maxWeeks);
        }

        const snapshot = await query.get();

        if (snapshot.empty) {
            console.log("ℹ️ Aucune donnée trouvée dans le Cloud.");
            if (statusEl) statusEl.innerText = '⚠️ No online data';
            return;
        }

        // 1. Réinitialisation des structures dans AppState
        appState.wars = {};
        appState.heroes = [];
        appState.titans = [];

        // 2. Fusion des 8 semaines récupérées directement dans AppState
        snapshot.forEach(doc => {
            let weekData = doc.data(); // Contient { weekId, wars, heroes, titans }

            if (weekData.wars) {
                Object.assign(appState.wars, weekData.wars);
            }
            if (Array.isArray(weekData.heroes)) {
                appState.heroes.push(...weekData.heroes);
            }
            if (Array.isArray(weekData.titans)) {
                appState.titans.push(...weekData.titans);
            }
        });

        console.log("🔥 Données chargées avec succès !");
        console.log(`- Guerres en mémoire : ${Object.keys(appState.wars).length}`);
        console.log(`- Lignes de héros : ${appState.heroes.length}`);
        console.log(`- Lignes de titans : ${appState.titans.length}`);

        if (statusEl) statusEl.innerText = '✅ Cloud data loaded';
                        
    } catch (err) {
        console.error("❌ Erreur lors du chargement depuis le Cloud :", err);
        if (statusEl) statusEl.innerText = '❌ Loading error';
        alert("Loading error: " + err.message);
    }
}

        function exportCSV(type) {
            const rows = type === 'hero' ? appState.heroes : appState.titans;
            const label = type === 'hero' ? 'heros' : 'titans';
            if (!rows || rows.length === 0) return false;

            const csv = Papa.unparse(rows);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", url);
            downloadAnchor.setAttribute("download", `database_batailles_${label}_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();

            } else {

async function importGuildWarFile(e) {
    const file = e.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('globalStatus');
    if (statusEl) statusEl.innerText = 'Importing war...';

    const reader = new FileReader();
    reader.onload = async function(evt) {
        try {
            const parsedWarData = JSON.parse(evt.target.result);
            const fileName = file.name; // ex: "war_2026_47.json" ou autre

            // 1. Déterminer la semaine (weekId) de cette guerre
            // On utilise ta fonction getWeekKeyForWar qui gère le season_day ou la date
            let weekId = getWeekKeyForWar(fileName, parsedWarData);
          
            // Petit fallback de sécurité si getWeekKeyForWar retourne null
            if (!weekId) {
                // On extrait l'année/semaine courante ou on demande une saisie, 
                // mais en général getWeekKeyForWar gère le season_day du JSON.
                throw new Error("Unable to determine the week (season_day) for this war.");
            }

            console.log(`🛡️ Guerre identifiée pour la semaine : ${weekId}`);

            // 2. Sauvegarde dans le Cloud (Sous-collection weeks/{weekId})
            // On stocke la guerre dans un objet structuré sous la clé du fichier ou un identifiant propre
            const docRef = db.collection("wars").doc(MY_GUILD_ID).collection("weeks").doc(weekId);
            
            // On utilise { merge: true } pour ne pas écraser les autres guerres ou les héros/titans de cette même semaine
            await docRef.set({
                weekId: weekId,
                wars: {
                    [fileName]: parsedWarData
                }
            }, { merge: true });

            console.log("🔥 Guerre sauvegardée avec succès dans Firestore !");

            // 3. Rechargement propre de l'application pour synchroniser l'UI et l'AppState
            await reloadApplication();

            // 4. Nettoyage et succès
            e.target.value = '';
            closeAdminModal();
            if (statusEl) statusEl.innerText = '✅ War imported';
            alert("⚔️ War imported and saved to the Cloud successfully!");

        } catch (err) {

            alert("Error reading or saving war: " + err.message);
            if (statusEl) statusEl.innerText = '❌ War import error';
        }
    };
    reader.readAsText(file);
}

		// utilitaire clipboard pour incrémenter l'heure d'une bataille d'une minute: HH:MM+1
		function incrementOneMinute(dateTimeStr) {
    		if (!dateTimeStr) return dateTimeStr;
    		let parts = dateTimeStr.split(' ');
    		if (parts.length < 2) return dateTimeStr;

    		let datePart = parts[0];
    		let timeSubParts = parts[1].split(':');
    		if (timeSubParts.length < 2) return dateTimeStr;

    		let hours = parseInt(timeSubParts[0], 10);
    		let minutes = parseInt(timeSubParts[1], 10);

    		minutes += 1;
    		if (minutes >= 60) {
        		minutes = 0;
        		hours = (hours + 1) % 24;
    		}

    		let newTimePart = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    		return `${datePart} ${newTimePart}`;
		}

		// utilitaire clipboard pour traiter un faux doublon (cad 2 attaques dans la meme minute contre le meme adversaire)
		function sanitizeRows(rows) {
    		let seenKeys = new Set();
    
    		rows.forEach(row => {
        		let key = `${row['attacker id'] || ''}_${row['defender id'] || ''}_${row['date time'] || ''}_${row['points'] || ''}`;
        
        		while (seenKeys.has(key)) {
            		row['date time'] = incrementOneMinute(row['date time']);
            		key = `${row['attacker id'] || ''}_${row['defender id'] || ''}_${row['date time'] || ''}_${row['points'] || ''}`;
        		}
        
        		seenKeys.add(key);
    		});
    
    		return rows;
		}

		// handler function when admin clicks on PASTE button (import CSV battles from clipboard)
        async function importSmartClipboard() {
            if (!navigator.clipboard || !navigator.clipboard.readText) {
                alert("Your browser does not allow automatic clipboard access.");
                return;
            }
            try {
                const text = await navigator.clipboard.readText();
                if (!text || text.trim().length === 0) {
                    alert("The clipboard is empty.");
                    return;
                }
                processSmartClipboard(text);
            } catch (err) {
                alert("Unable to read clipboard: " + err.message);
            }
        }

		// check data in clipboard to identify data (hero or titan battles)
        function processSmartClipboard(csvText) {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                	let rows = results.data;

            		// 1. On nettoie/sanitize les faux doublons du clipboard via notre fonction dédiée
            		rows = sanitizeRows(rows);

            		// 2. On identifie s'il s'agit de héros ou de titans
            		const hasPetsData = rows.some(row => {
                		const attPet = row['attacker pet'] || row['att pet'] || row['attacker pets'] || '';
                		const defPet = row['defender pet'] || row['def pet'] || row['defender pets'] || '';
                		return String(attPet).trim().length > 0 || String(defPet).trim().length > 0;
            		});

            		let targetType = hasPetsData ? 'hero' : 'titan';

            		// 3. On envoie le tout à la suite
            		processCSVTextParsed(rows, targetType);
                },
                error: function(err) {
                    alert("CSV detection error: " + err.message);
                }
            });
        }

async function processCSVTextParsed(incomingRows, type) {
    const statusEl = document.getElementById('globalStatus');
    if (statusEl) statusEl.innerText = `Importing ${type} battles to the Cloud...`;

    try {
        // 1. Grouper les lignes entrantes par semaine (weekId) en se basant sur leur date
        let rowsByWeek = {};
        incomingRows.forEach(row => {
            let dateTime = row['date time'] || row['date'] || '';
            let wk = getWeekKeyFromDateString(dateTime);
            if (wk) {
                if (!rowsByWeek[wk]) rowsByWeek[wk] = [];
                rowsByWeek[wk].push(row);
            }
        });

        let weeksToUpdate = Object.keys(rowsByWeek);
        if (weeksToUpdate.length === 0) {
            alert("No valid date found in clipboard data to sort by week.");
            if (statusEl) statusEl.innerText = 'Database ready';
            return;
        }

        // 2. Mettre à jour chaque semaine concernée dans Firestore
        for (let wk of weeksToUpdate) {
            let newRowsForThisWeek = rowsByWeek[wk];
            let docRef = db.collection("wars").doc(MY_GUILD_ID).collection("weeks").doc(wk);

            // On récupère le document existant de la semaine
            let docSnap = await docRef.get();
            let existingData = docSnap.exists ? docSnap.data() : { weekId: wk, wars: {}, heroes: [], titans: [] };

            let targetField = type === 'hero' ? 'heroes' : 'titans';
            let existingRows = existingData[targetField] || [];

            // Fusion propre (gère le chevauchement d'import)
            let mergedRows = mergeUniqueRows(existingRows, newRowsForThisWeek);

            // Enregistrement dans Firestore
            await docRef.set({
                weekId: wk,
                [targetField]: mergedRows
            }, { merge: true });
        }

        console.log(`✅ Batailles de ${type} synchronisées avec Firestore pour ${weeksToUpdate.length} semaine(s).`);

        // 3. Rechargement propre de l'application
        if (typeof reloadApplication === 'function') {
            await reloadApplication();
        } else {
            await loadFromCloud(8);
            if (typeof updateNavigationUI === 'function') updateNavigationUI();
            if (typeof updateDatabaseUI === 'function') updateDatabaseUI();
            if (typeof renderDashboard === 'function') renderDashboard();
        }

        const logEl = document.getElementById('smartImportLog');
        if (logEl) {
            logEl.innerText = `✅ ${type.toUpperCase()} battles saved to the Cloud`;
        }

        if (statusEl) statusEl.innerText = '✅ Cloud import successful';
        alert(`🎉 ${type} battles imported and saved to the Cloud successfully!`);

    } catch (err) {
        console.error("❌ Erreur lors de l'import CSV Cloud :", err);
        alert("Error saving battles: " + err.message);
        if (statusEl) statusEl.innerText = '❌ CSV import error';
    }
}

function mergeUniqueRows(existingRows, newRows) {
    const uniqueMap = new Map();

    // 1. On charge l'historique existant
    existingRows.forEach(row => {
        const key = `${row['attacker id'] || ''}_${row['defender id'] || ''}_${row['date time'] || ''}_${row['points'] || ''}`;
        uniqueMap.set(key, row);
    });

    // 2. On fusionne les nouvelles lignes (déjà sanitisées en amont)
    newRows.forEach(row => {
        const key = `${row['attacker id'] || ''}_${row['defender id'] || ''}_${row['date time'] || ''}_${row['points'] || ''}`;
        uniqueMap.set(key, row);
    });

    // 3. On retourne le tableau combiné et dédupliqué
    return Array.from(uniqueMap.values());
}

        function updateDatabaseUI() {
            const hMeta = document.getElementById('heroMeta');

        function parseTeamString(rawStr, isAttacker, isTitanTeam = false) {
            if (!rawStr || typeof rawStr !== 'string') {
                return { pet: { name: '###', power: '' }, heroes: Array(5).fill({ name: '###', power: '' }) };
            }

            let parts = rawStr.trim().split(/\s+/).filter(s => s.length > 0);
            let petRaw = '###';
            let heroesRaw = [];

            if (isTitanTeam) {
                heroesRaw = parts.slice(0, 5);
            } else {
                if (isAttacker) {
                    if (parts.length > 0) petRaw = parts[0];
                    heroesRaw = parts.slice(1, 6);
                } else {
                    heroesRaw = parts.slice(0, 5);
                    if (parts.length >= 6) {
                        petRaw = parts[5];
                    }
                }
            }

            while (heroesRaw.length < 5) {
                heroesRaw.push('###');
            }

            function formatItem(itemStr) {
                if (!itemStr || itemStr === '###') return { name: '###', power: '' };
                let match = itemStr.match(/^(.+?)\((.+?)\)$/);
                if (match) {
                    return { name: match[1].trim(), power: match[2].trim() };
                }
                return { name: itemStr, power: '' };
            }

            return {
                pet: formatItem(petRaw),
                heroes: heroesRaw.map(formatItem)
            };
        }

        function parseIndividualPets(petsRawStr) {
            if (!petsRawStr || typeof petsRawStr !== 'string') {
                return Array(5).fill({ name: '###' });
            }
            let parts = petsRawStr.trim().split(/\s+/).filter(s => s.length > 0);
            while (parts.length < 5) {
                parts.push('###');
            }
            return parts.slice(0, 5).map(itemStr => {
                if (!itemStr || itemStr === '###') return { name: '###' };
                let namePart = itemStr.split('(')[0].trim();
                let shortName = namePart.slice(0, 3);
                return { name: shortName, raw: itemStr };
            });
        }

            if (!abbr || abbr === '###') return '';
            let cleanAbbr = abbr.trim();
            let folder = isTitan ? 'titans/avatars' : (isPet ? 'heroes/pets' : 'heroes/avatars');
            return `${folder}/${cleanAbbr}.png`;
        }

        function toRoman(num) {
            let n = parseInt(num);
            if (isNaN(n) || n <= 0) return num;
            const lookup = {M:1000, CM:900, D:500, CD:400, C:100, XC:90, L:50, XL:40, X:10, IX:9, V:5, IV:4, I:1};
            let roman = "";
            for (let i in lookup ) {
                while ( n >= lookup[i] ) {
                    roman += i;
                    n -= lookup[i];
                }
            }
            return roman;
        }

        function getTotemBorderColor(totemName) {
            if (!totemName) return 'border-purple-500/60';
            let firstChar = totemName.trim().charAt(0).toUpperCase();
            switch (firstChar) {
                case 'W': return 'border-cyan-400';
                case 'F': return 'border-rose-500';
                case 'E': return 'border-emerald-400';
                case 'L': return 'border-amber-300';
                case 'D': return 'border-purple-500';
                case 'X': return 'border-slate-150';
                default:  return 'border-purple-400';
            }
        }

        function parseTotemsWithSkills(totemAbbrRaw, totemSkillsRaw) {
            let abbrs = totemAbbrRaw ? totemAbbrRaw.trim().split(/\s+/).filter(s => s.length > 0) : [];
            let skillTokens = totemSkillsRaw ? totemSkillsRaw.trim().split(/\s+/).filter(s => s.length > 0) : [];

            let result = [];
            for (let i = 0; i < abbrs.length; i++) {
                let totemStr = abbrs[i]; 
                let totemName = totemStr;
                let totemPower = '';

                let match = totemStr.match(/^(.+?)\((.+?)\)$/);
                if (match) {
                    totemName = match[1].trim();
                    totemPower = match[2].trim();
                }

                let s1Token = skillTokens[i * 2] || '';
                let s2Token = skillTokens[i * 2 + 1] || '';

                function parseSkill(token) {
                    if (!token) return null;
                    let m = token.match(/^([a-zA-Z]{2})(\d+)$/);
                    if (m) {
                        return { code: m[1].toUpperCase(), level: m[2], levelRoman: toRoman(m[2]) };
                    }
                    return { code: token, level: '', levelRoman: '' };
                }

                result.push({
                    rawString: totemStr,
                    name: totemName,
                    power: totemPower,
                    skill1: parseSkill(s1Token),
                    skill2: parseSkill(s2Token),
                    borderColor: getTotemBorderColor(totemName)
                });
            }
            return result;
        }

                                <div class="relative w-[50px] h-[50px] rounded-full bg-slate-950 border-2 ${slot.isPet ? 'border-amber-400' : 'border-slate-700'} flex items-center justify-center overflow-hidden shadow-md">

        }

        function isTitanBattleRow(row) {
            if (!row || typeof row !== 'object') return false;
            const hasPet = Boolean(
                String(row['attacker pet'] || row['att pet'] || row['attacker pets'] || row['defender pet'] || row['def pet'] || row['defender pets'] || '').trim()
            );
            if (hasPet) return false;

            const hasTotem = Boolean(
                String(
                    row['A flag/totem'] || row['att totem'] ||
                    row['D flag/totem'] || row['def totem'] ||
                    row['A flag desc/Totem skills'] || row['att totem skills'] ||
                    row['D flag desc/Totem skills'] || row['def totem skills'] || ''
                ).trim()
            );
            return hasTotem;
        }

        function isRowFromAttackingGuild(row, attackingMembersMap) {
            if (!(attackingMembersMap instanceof Map) || attackingMembersMap.size === 0) {
                return false;
            }
            const rowAttId = String(row['attacker id'] || '').trim();
            if (rowAttId && attackingMembersMap.has(rowAttId)) {
                return true;
            }
            const rowAttName = String(row['att name'] || row['attacker name'] || '').trim().toLowerCase();
            if (!rowAttName) return false;

            for (const member of attackingMembersMap.values()) {
                if (member.name && member.name.toLowerCase() === rowAttName) {
                    return true;
                }
            }
            return false;
        }

        function getDefenderAttacksHistory(defId, isTitan, viewMode = appState.currentView) {
            const cleanDefId = String(defId || '').trim();
            if (!cleanDefId) return [];

            const ctx = appState.activeWarContext || {};
            // En mode 'attacks', les attaquants doivent appartenir à notre guilde ; en mode 'defenses', à la guilde adverse
            const attackingMembersMap = (viewMode === 'defenses') ? ctx.enemyMembersMap : ctx.ourMembersMap;

            const targetIsTitan = Boolean(isTitan);
            const extractMatchingRows = (rows) => {
                if (!rows || !Array.isArray(rows) || rows.length === 0) return [];
                let items = [];
                rows.forEach(row => {
                    let rowDefId = String(row['defender id'] || '').trim();
                    if (rowDefId !== cleanDefId) return;

                    // Filtrage par la guilde en attaque
                    if (!isRowFromAttackingGuild(row, attackingMembersMap)) return;

                    const rowHasExplicitPetOrTotem = Boolean(
                        String(
                            row['attacker pet'] || row['att pet'] || row['attacker pets'] ||
                            row['defender pet'] || row['def pet'] || row['defender pets'] ||
                            row['A flag/totem'] || row['att totem'] ||
                            row['D flag/totem'] || row['def totem'] || ''
                        ).trim()
                    );
                    const rowIsTitan = rowHasExplicitPetOrTotem ? isTitanBattleRow(row) : (rows === appState.titans);

                    let dateTime = row['date time'] || '';

                    let matchDate = dateTime.match(/(\d{2})[-/](\d{2})/);
                    if (matchDate) {
                        datePart = `${matchDate[1]}/${matchDate[2]}`;
                    }

                    let attName = row['att name'] || row['attacker name'] || 'Unknown';
                    let pts = row['points'] || '0';

                    items.push({
                        date: datePart,
                        attackerName: attName,
                        points: pts,
                        dateTimeFull: dateTime,
                        rawRow: row
                    });
                });
                return items;
            };

            const primaryRows = targetIsTitan ? appState.titans : appState.heroes;
            const secondaryRows = targetIsTitan ? appState.heroes : appState.titans;
            let history = [
                ...extractMatchingRows(primaryRows),
                ...extractMatchingRows(secondaryRows)
            ];

            history.sort((a, b) => b.dateTimeFull.localeCompare(a.dateTimeFull));
            return history;

        window._activeBattlesMap = new Map();

        function openBattleModal(battleId) {

            const contentEl = document.getElementById('battleModalContent');

            let datePart = '--/--';

                let matchDate = b.dateTimeFull.match(/(\d{2})[-/](\d{2})/);
                if (matchDate) datePart = `${matchDate[1]}/${matchDate[2]}`;
            } else if (b.isUnattackedSlot && appState.activeKey && appState.wars[appState.activeKey]) {
                const warDateObj = extractDateForWar(appState.activeKey, appState.wars[appState.activeKey]);
                if (warDateObj && warDateObj.shortDate && warDateObj.shortDate !== '--/--') {
                    datePart = warDateObj.shortDate;
                }

            const pointsColorClass = b.isSuccessful ? 'text-emerald-400' : 'text-rose-500';
            const viewMode = window._currentBattleModalContext?.viewMode || appState.currentView;
            const defenderAttacksHistory = getDefenderAttacksHistory(b.defId, isTitan, viewMode);

            function renderHistorySelect(historyList) {
                if (!historyList || historyList.length === 0) {
                    return `<select class="w-full text-[11px] bg-slate-900 text-slate-400 border border-slate-800 rounded px-2 py-1 outline-none mt-2 cursor-not-allowed" disabled>
                        <option>No attack history</option>
                    </select>`;
                }

				// Fonction pour transformer "DD/MM HH:MM" en nombre comparable (ex: 14051703)
                const convertCSVDateFormat = (str) => {
                    if (!str) return 0;
                    // On extrait uniquement les chiffres avec une regex
                    let matches = str.match(/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
                    if (!matches) return 0;
                    // On fabrique un entier YYYYMMDDHHMM (en supposant l'année courante ou arbitraire)
                    let [, day, month, hour, min] = matches;
                    return parseInt(`2026${month}${day}${hour}${min}`, 10);
                };

				// 🔄 TRI DU PLUS RÉCENT AU PLUS ANCIEN
                const sortedHistory = [...historyList].sort((a, b) => {
                    let strA = a.dateTimeFull || a['date time'] || '';
                    let strB = b.dateTimeFull || b['date time'] || '';

                    let timeA = convertCSVDateFormat(strA);
                    let timeB = convertCSVDateFormat(strB);

                    return timeB - timeA; // Du plus grand (récent) au plus petit (ancien)

                // On utilise sortedHistory à la place de historyList pour mapper les options
                let optionsHTML = sortedHistory.map((h, idx) => {

                    return `<option value="${idx}"${isSelected}>${h.dateTimeFull} - ${h.attackerName} (+${h.points} pts)</option>`;

                return `

            const topBlockHTML = b.isUnattackedSlot ? `
                <!-- 1. BLOC HAUT : Slot non attaqué à cette date -->

                            <span class="font-mono text-slate-400 text-xs">${timePart}</span>
